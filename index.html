<!doctype html>
<html lang="en">
<head>

  <style>

      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

    .card{

      display:grid;place-items:center;background:#fff;color:#111;font-size:34px;
    }
    h1{font-size:28px;margin:0 0 10px}
    p{color:#aeb5bf;line-height:1.5;margin:0 0 24px}
    a{
      display:block;padding:15px 20px;border-radius:14px;
      background:#fff;color:#111;text-decoration:none;font-weight:700;
    }
    .small{font-size:12px;color:#727984;margin-top:18px}

</head>
<body>
  <main class="card">
    <div class="icon">✉</div>
    <h1>Contact Sujay</h1>
    <p>Your email app should open automatically. If it doesn't, tap the button below.</p>
    <a href="mailto:sujayhelp1@gmail.com?subject=Contact%20from%20Instagram">Open Email App</a>
